asyncapi: '2.6.0'
info:
  title: OpenET Streaming APIs
  version: '0.1.0'
  description: >
    Async API for streaming data from eye-tracking devices in real time.
    Uses standard OpenET data schemas.

# servers:
#   websocket-server:
#     url: wss://stream.openet.org
#     protocol: wss
#     description: WebSocket server for real-time gaze streaming

channels:
  stream_gaze:
    description: Stream of raw gaze data from a device
    subscribe:
      summary: Receive live gaze data
      operationId: subscribeGaze
      message:
        $ref: './schemas/raw.gaze.json'  
        name: RawGaze
        title: RawGaze
        summary: A single gaze sample

components:
  schemas:
    RawGaze:
      $ref: 'schemas/raw.gaze.json'